name: Stock DNA

# Every Saturday morning (the DNA moves slowly), or by hand: Actions > Stock DNA > Run workflow
on:
  schedule:
    - cron: '17 5 * * 6'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dna
  cancel-in-progress: false

jobs:
  dna:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Measure the DNA of every stock
        run: node dna/build.mjs
      - name: Save dna.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add dna.json dna_avg.json
          git diff --cached --quiet && echo "no change" && exit 0
          git commit -m "DNA update $(date -u +%Y-%m-%d)"
          git pull --rebase
          git push
